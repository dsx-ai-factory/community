<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 326" width="640" height="326" role="img"
     aria-labelledby="dsx-stack-title dsx-stack-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dsx-stack-title">The DSX Portfolio, by Brand</title>
  <desc id="dsx-stack-desc">
    DSX Sim, DSX OS, DSX Exchange, DSX Flex, and DSX MaxLPS, each shown with what it
    covers. DSX OS and DSX Exchange are highlighted and labeled with an open-source
    component count: that is where the open-source components are concentrated.
  </desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .band { stroke-width: 2; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; }
  </style>
  <rect class="band" x="20" y="10" width="600" height="50" rx="6" fill="#a8d977" stroke="#ffffff"/>
  <text class="label" x="36" y="31" fill="#1b1b1b">DSX Sim</text>
  <text class="sub" x="36" y="51" fill="#1b1b1b">Models the stack, so a factory can be validated before it is built</text>

  <rect class="band" x="20" y="64" width="600" height="90" rx="6" fill="#76b900" stroke="#ffffff"/>
  <text class="label" x="36" y="105" fill="#ffffff">DSX OS</text>
  <text class="sub" x="36" y="125" fill="#ffffff">Orchestration, monitoring, scheduling, and inference software &#8212; 44 open source</text>

  <rect class="band" x="20" y="158" width="600" height="50" rx="6" fill="#76b900" stroke="#ffffff"/>
  <text class="label" x="36" y="179" fill="#ffffff">DSX Exchange</text>
  <text class="sub" x="36" y="199" fill="#ffffff">IT/OT communication: event bus and agent gateway &#8212; 1 open source</text>

  <rect class="band" x="20" y="212" width="600" height="50" rx="6" fill="#e2e2e2" stroke="#9a9a9a"/>
  <text class="label" x="36" y="233" fill="#4a4a4a">DSX Flex</text>
  <text class="sub" x="36" y="253" fill="#4a4a4a">Dynamic power orchestration with grid and energy providers</text>

  <rect class="band" x="20" y="266" width="600" height="50" rx="6" fill="#e2e2e2" stroke="#9a9a9a"/>
  <text class="label" x="36" y="287" fill="#4a4a4a">DSX MaxLPS</text>
  <text class="sub" x="36" y="307" fill="#4a4a4a">Power architecture, cooling efficiency, and grid integration</text>
</svg>
