# DSX AI Factory communities
#
# This file is the source of truth for community coordinates.
# communities/README.md shows the same information as a readable page.
# When you change this file, update README.md in the same pull request.
#
# A community can cover one project or several related projects.
# List every repository the community covers under `repositories`.
#
# Fields
#   id:            short identifier, lowercase with hyphens
#   name:          display name
#   description:   one sentence on what the community covers
#   repositories:  GitHub repositories the community covers
#   slack:         channel in the DSX AI Factory Slack workspace
#   mailing_list:  address and join page (meeting invites and announcements)
#   meetings:      cadence, day, time and time zone; "to be announced" if not set
#   notes:         meeting notes document (open for comments)
#   drive_folder:  public folder with notes, recordings and slides
#   leads:         optional; GitHub handles of the people who run the community

communities:
  - id: gpu-operator
    name: NVIDIA GPU Operator
    description: Creates, configures, and manages GPUs in Kubernetes.
    repositories:
      - https://github.com/NVIDIA/gpu-operator
    slack: "#gpu-operator"
    mailing_list:
      address: gpu-operator@dsxaifactory.com
      join: https://groups.google.com/a/dsxaifactory.com/g/gpu-operator
    meetings:
      cadence: every 4 weeks
      day: Monday
      time: to be announced
      first_meeting: In person at the DSX OS Contributor Workshop, Monday, November 9, 2026, 4:45 to 5:45 PM MT, Salt Lake City
    notes: https://docs.google.com/document/d/1rHtnDgfv1IRiFmGpOrc7v1MGVfeCo2ASzWZOmKscyyg/edit
    drive_folder: https://drive.google.com/drive/folders/1o7_A5w-Hq1jNgnwOj8Q415LLxlmLwNla

  - id: k8s-cluster-management
    name: NVIDIA DSX K8s Cluster Management
    description: "Building and running Kubernetes clusters on NVIDIA GPU infrastructure: NVKE, NVKR, and the NICo CAPI Provider."
    repositories:
      - https://github.com/dsx-ai-factory/nvke
      - https://github.com/dsx-ai-factory/nvkr
      - https://github.com/dsx-ai-factory/cluster-api-provider-nico
    slack: "#nvidia-dsx-k8s-cluster-management"
    mailing_list: to be announced
    meetings:
      cadence: to be announced
    notes: https://docs.google.com/document/d/1l5jWUBUG5ZkuZTFFT55T1qpoIN7VCXoU0dAZu0LE4UQ/edit
    drive_folder: https://drive.google.com/drive/folders/1U-MwG5p1apImw8tsuwCRoT-h3rl5XADP

  - id: k8s-cluster-health-configuration
    name: NVIDIA DSX K8s Cluster Health & Configuration
    description: "Configuring Kubernetes clusters and keeping them healthy: NVCRE, AICR, NVSentinel, NKTP, Nodewright, and Topograph."
    repositories:
      - https://github.com/NVIDIA/cluster-readiness-engine
      - https://github.com/NVIDIA/aicr
      - https://github.com/NVIDIA/NVSentinel
      - https://github.com/dsx-ai-factory/nvke-telemetry-pipeline
      - https://github.com/NVIDIA/nodewright
      - https://github.com/dsx-ai-factory/topograph
    slack: "#nvidia-dsx-k8s-cluster-health-configuration"
    mailing_list: to be announced
    meetings:
      cadence: to be announced
    notes: https://docs.google.com/document/d/1NE8SSWKVj17VJ_Cae186yf5xse2NpfW8t0633JKtZpk/edit
    drive_folder: https://drive.google.com/drive/folders/1lF6WQo1kmeond1C3nKf2pSfBiZkpcPqV

  - id: run-ai
    name: NVIDIA Run:ai
    description: The AI workload orchestration platform for Kubernetes.
    repositories:
      - https://github.com/dsx-ai-factory/run-ai
    slack: "#run-ai"
    mailing_list:
      address: run-ai@dsxaifactory.com
      join: https://groups.google.com/a/dsxaifactory.com/g/run-ai
    meetings:
      cadence: to be announced on the mailing list
      first_meeting: In person at the DSX OS Contributor Workshop, Monday, November 9, 2026, 4:45 to 5:45 PM MT, Salt Lake City
    notes: https://docs.google.com/document/d/1JbbBnGL-E0OS0pH0bjf7OSCYNRJyyMpzSkg2s12qHcc/edit
    drive_folder: https://drive.google.com/drive/folders/18fJnJw4c9mTwq3IOvEL8zDqkxq_pullC
